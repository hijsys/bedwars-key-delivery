<!DOCTYPE html>
<html>
<head>
    <title>BedWars Client Key</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; }
        #key { font-size: 24px; padding: 20px; background: #333; border-radius: 10px; margin: 20px; }
        .warning { color: #ff5555; }
    </style>
</head>
<body>
    <h1>BedWars Paid Client Key</h1>
    <p>Copy this key into your Roblox client to unlock cheats!</p>
    <p id="key">Loading...</p>
    <p class="warning">Key valid for 24 hours. Don’t share—it’s tied to your Roblox account!</p>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        if (!userId) {
            document.getElementById('key').innerText = 'Error: No UserId provided.';
        } else {
            // Simulate key generation (replace with Firebase or Roblox HttpService)
            const key = Array(26).fill().map(() => String.fromCharCode(65 + Math.floor(Math.random() * 26))).join('');
            document.getElementById('key').innerText = key;
            // In prod: Fetch from Firebase or Roblox server
            // fetch(`https://your-firebase-or-roblox-endpoint/getKey?userId=${userId}`)
            //     .then(res => res.json())
            //     .then(data => document.getElementById('key').innerText = data.key)
            //     .catch(() => document.getElementById('key').innerText = 'Error: Failed to fetch key.');
        }
    </script>
</body>
</html>
