<!DOCTYPE html>
<html>
<head>
    <title>BedWars Client Key</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #1a1a1a; color: #fff; padding: 20px; }
        #key { font-size: 24px; padding: 20px; background: #333; border-radius: 10px; margin: 20px; word-break: break-all; }
        .warning { color: #ff5555; font-size: 14px; }
        .instructions { background: #444; padding: 10px; border-radius: 5px; margin: 10px; }
    </style>
</head>
<body>
    <h1>🔥 BedWars Paid Client Key</h1>
    <p>Your unique key for ESP, Fly, KillAura & more!</p>
    <div id="key">Loading your key...</div>
    <div class="instructions">
        <strong>Instructions:</strong> Copy the key below and paste it into your Roblox client. Valid for 24 hours—don't share!
    </div>
    <p class="warning">Key is tied to your Roblox account. Refresh if it doesn't load.</p>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        if (!userId) {
            document.getElementById('key').innerText = 'Error: No UserId provided. Go back and try again.';
        } else {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let key = '';
            for (let i = 0; i < 26; i++) {
                key += chars[Math.floor(Math.random() * 26)];
            }
            document.getElementById('key').innerText = key;
            console.log('Generated key for UserId ' + userId + ': ' + key);
        }
    </script>
</body>
</html>
